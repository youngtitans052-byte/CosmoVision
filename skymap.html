<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Cosmo Vision - Sky Map</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030407;
    color:#e0e6ed;
    font-family:Segoe UI,Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    cursor:grab;
}

canvas:active{
    cursor:grabbing;
}

/* TOP BAR */

#top-bar{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;

    background:rgba(5,8,15,.9);
    border:1px solid rgba(0,255,255,.4);
    border-radius:40px;

    padding:9px 18px;

    color:#00ffff;
    font-weight:700;
    letter-spacing:1.5px;

    box-shadow:0 0 20px rgba(0,255,255,.2);

    white-space:nowrap;
}

/* LOADING */

#loading{
    display:none;

    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);

    z-index:30;

    padding:8px 15px;

    background:rgba(5,8,15,.9);
    border:1px solid rgba(0,255,255,.4);
    border-radius:7px;

    color:#00ffff;
    font-size:13px;
}

/* CONTROL PANEL */

#ui-panel{
    position:absolute;

    bottom:18px;
    left:50%;
    transform:translateX(-50%);

    width:95%;
    max-width:720px;

    z-index:20;

    background:rgba(5,8,15,.9);

    border:1px solid rgba(0,255,255,.3);

    border-radius:14px;

    padding:15px;

    backdrop-filter:blur(10px);

    box-shadow:
        0 0 25px rgba(0,255,255,.15);
}

#toggle-panel{
    text-align:center;

    color:#00ffff;

    cursor:pointer;

    margin:-7px 0 8px;

    font-size:17px;
}

#ui-panel.minimized #panel-content{
    display:none;
}

.time-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    padding-bottom:7px;

    border-bottom:
        1px solid rgba(0,255,255,.2);
}

#time-display{
    color:#00ffff;

    font-family:monospace;

    font-size:15px;

    font-weight:bold;
}

#coords-display{
    color:#8fa3b8;

    font-family:monospace;

    font-size:12px;
}

.slider-container{
    display:flex;

    align-items:center;

    gap:10px;

    margin-top:12px;
}

input[type="range"]{
    flex:1;

    accent-color:#00ffff;
}

.slider-labels{
    display:flex;

    justify-content:space-between;

    color:#64748b;

    font-size:11px;
}

#weather-info{
    margin-top:7px;

    color:#94a3b8;

    font-size:13px;
}

.controls{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    align-items:center;

    margin-top:11px;

    padding-top:11px;

    border-top:
        1px dashed rgba(0,255,255,.2);
}

.small-label{
    color:#8fa3b8;

    font-size:12px;
}

input[type="number"]{
    width:80px;

    padding:7px;

    background:#030407;

    color:#00ffff;

    border:
        1px solid #00ffff;

    border-radius:5px;

    font-family:monospace;
}

button{
    padding:7px 12px;

    background:
        rgba(0,255,255,.1);

    color:#00ffff;

    border:
        1px solid #00ffff;

    border-radius:5px;

    font-weight:bold;

    cursor:pointer;
}

button:active{
    background:#00ffff;

    color:#000;
}
</style>
</head>

<body>

<div id="top-bar">
    🌌 COSMO VISION — SKY MAP
</div>

<div id="loading">
    Syncing weather data...
</div>

<canvas id="skyCanvas"></canvas>

<div id="ui-panel">

    <div id="toggle-panel">
        ▼
    </div>

    <div id="panel-content">

        <div class="time-header">

            <span id="time-display">
                Loading time...
            </span>

            <span id="coords-display">
                Lat: 20.26° N | Lon: 75.77° E
            </span>

        </div>


        <div class="slider-container">

            <span class="small-label">
                −24h
            </span>

            <input
                type="range"
                id="timeSlider"
                min="-24"
                max="72"
                value="0"
                step="0.01"
            >

            <span class="small-label">
                +72h
            </span>

        </div>


        <div class="slider-labels">

            <span>
                Past 24 Hours
            </span>

            <span>
                Live
            </span>

            <span>
                Next 72 Hours
            </span>

        </div>


        <div id="weather-info">
            Cloud Cover: --
        </div>


        <div class="controls">

            <span class="small-label">
                Location:
            </span>

            <input
                type="number"
                id="latInput"
                value="20.26"
                step="0.01"
                placeholder="Lat"
            >

            <input
                type="number"
                id="lonInput"
                value="75.77"
                step="0.01"
                placeholder="Lon"
            >

            <button id="btnSetLoc">
                Set
            </button>

            <button id="btnAutoLoc">
                📍 Auto GPS
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   COSMO VISION SKY MAP
   ===================================================== */


const canvas =
    document.getElementById("skyCanvas");

const ctx =
    canvas.getContext("2d");


const timeSlider =
    document.getElementById("timeSlider");

const timeDisplay =
    document.getElementById("time-display");

const coordsDisplay =
    document.getElementById("coords-display");

const weatherInfo =
    document.getElementById("weather-info");

const loading =
    document.getElementById("loading");

const latInput =
    document.getElementById("latInput");

const lonInput =
    document.getElementById("lonInput");

const btnSetLoc =
    document.getElementById("btnSetLoc");

const btnAutoLoc =
    document.getElementById("btnAutoLoc");

const uiPanel =
    document.getElementById("ui-panel");

const togglePanel =
    document.getElementById("toggle-panel");


/* =====================================================
   LOCATION
   ===================================================== */

let lat = 20.26;

let lon = 75.77;


/* =====================================================
   CAMERA
   ===================================================== */

let scale = 1;

let panX = window.innerWidth / 2;

let panY = window.innerHeight / 2;

let dragging = false;

let startX = 0;

let startY = 0;


/* =====================================================
   WEATHER DATA
   ===================================================== */

let weatherData = null;


/* =====================================================
   CLOUD FIELD
   ===================================================== */

let cloudField = [];


function generateClouds(){

    cloudField = [];

    for(let i=0;i<450;i++){

        cloudField.push({

            azimuth:
                Math.random() *
                Math.PI *
                2,

            altitude:
                Math.pow(
                    Math.random(),
                    .7
                ) * 88,

            scale:
                .7 +
                Math.random() * .8,

            layer:
                Math.random() < .4
                ? "low"
                :
                Math.random() < .7
                ? "mid"
                :
                "high"

        });

    }

}


generateClouds();


/* =====================================================
   HELPERS
   ===================================================== */

function lerp(a,b,t){

    return a +
        (b-a)*t;

}


function value(array,index){

    if(!array)
        return 0;

    if(array[index] === undefined)
        return 0;

    return Number(array[index]) || 0;

}


function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


/* =====================================================
   RESIZE
   ===================================================== */

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    if(!panX)
        panX =
            canvas.width/2;

    if(!panY)
        panY =
            canvas.height/2;

    draw();

}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   WEATHER API
   ===================================================== */

async function fetchWeatherData(){

    loading.style.display =
        "block";

    loading.innerText =
        "Syncing weather data...";


    try{

        const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,is_day,wind_direction_10m&past_days=1&forecast_days=4&timezone=auto`;


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(data.error){

            throw new Error(
                data.reason
            );

        }


        weatherData =
            data.hourly;


        weatherData.currentIndex =
            24;


        updateCoordinates();


        draw();


    }

    catch(error){

        console.error(error);

        alert(
            "Weather data could not be loaded. Please check your internet connection."
        );

    }

    finally{

        loading.style.display =
            "none";

    }

}


/* =====================================================
   COORDINATES
   ===================================================== */

function updateCoordinates(){

    const latDirection =
        lat >= 0
        ? "N"
        : "S";


    const lonDirection =
        lon >= 0
        ? "E"
        : "W";


    coordsDisplay.innerText =
        `Lat: ${Math.abs(lat).toFixed(2)}° ${latDirection} | Lon: ${Math.abs(lon).toFixed(2)}° ${lonDirection}`;

}


/* =====================================================
   MAIN DRAW FUNCTION
   ===================================================== */

function draw(){

    if(!weatherData)
        return;


    const offset =
        parseFloat(
            timeSlider.value
        );


    let index =
        weatherData.currentIndex +
        Math.floor(offset);


    index =
        clamp(
            index,
            0,
            weatherData.time.length-2
        );


    const fraction =
        offset -
        Math.floor(offset);


    const time0 =
        new Date(
            weatherData.time[index]
        ).getTime();


    const time1 =
        new Date(
            weatherData.time[index+1]
        ).getTime();


    const exactTime =
        new Date(
            lerp(
                time0,
                time1,
                fraction
            )
        );


    timeDisplay.innerText =
        exactTime.toLocaleString(
            [],
            {
                weekday:"short",
                month:"short",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    /* CLOUD DATA */

    const totalCloud =
        lerp(
            value(
                weatherData.cloud_cover,
                index
            ),
            value(
                weatherData.cloud_cover,
                index+1
            ),
            fraction
        );


    const lowCloud =
        lerp(
            value(
                weatherData.cloud_cover_low,
                index
            ),
            value(
                weatherData.cloud_cover_low,
                index+1
            ),
            fraction
        );


    const midCloud =
        lerp(
            value(
                weatherData.cloud_cover_mid,
                index
            ),
            value(
                weatherData.cloud_cover_mid,
                index+1
            ),
            fraction
        );


    const highCloud =
        lerp(
            value(
                weatherData.cloud_cover_high,
                index
            ),
            value(
                weatherData.cloud_cover_high,
                index+1
            ),
            fraction
        );


    const day =
        lerp(
            value(
                weatherData.is_day,
                index
            ),
            value(
                weatherData.is_day,
                index+1
            ),
            fraction
        );


    weatherInfo.innerText =
        `Total Cloudiness: ${Math.round(totalCloud)}% | Low: ${Math.round(lowCloud)}% | Mid: ${Math.round(midCloud)}% | High: ${Math.round(highCloud)}%`;


    /* =================================================
       CLEAR CANVAS
       ================================================= */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* =================================================
       SKY RADIUS
       ================================================= */

    const radius =
        Math.min(
            canvas.width,
            canvas.height
        ) *
        0.42 *
        scale;


    ctx.save();


    ctx.translate(
        panX,
        panY
    );


    /* =================================================
       BACKGROUND
       ================================================= */

    ctx.fillStyle =
        "#03040a";


    ctx.fillRect(
        -panX,
        -panY,
        canvas.width,
        canvas.height
    );


    /* =================================================
       SKY CIRCLE
       ================================================= */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI*2
    );


    const skyGradient =
        ctx.createRadialGradient(
            0,
            0,
            5,
            0,
            0,
            radius
        );


    if(day > .5){

        skyGradient.addColorStop(
            0,
            "#143c5a"
        );

        skyGradient.addColorStop(
            .7,
            "#0f2d4b"
        );

        skyGradient.addColorStop(
            1,
            "#19466e"
        );

    }

    else{

        skyGradient.addColorStop(
            0,
            "#02050c"
        );

        skyGradient.addColorStop(
            .7,
            "#040916"
        );

        skyGradient.addColorStop(
            1,
            "#08101f"
        );

    }


    ctx.fillStyle =
        skyGradient;

    ctx.fill();


    /* =================================================
       CLIP INSIDE CIRCLE
       ================================================= */

    ctx.save();

    ctx.clip();


    /* =================================================
       CIRCULAR ALTITUDE GRID
       ================================================= */

    ctx.lineWidth = 1;

    ctx.strokeStyle =
        "rgba(0,255,255,.30)";

    ctx.fillStyle =
        "rgba(0,255,255,.75)";

    ctx.font =
        "11px monospace";


    let altitudeStep =
        15;


    if(scale > 4)
        altitudeStep = 5;


    if(scale > 15)
        altitudeStep = 1;


    for(
        let altitude=0;
        altitude<=90;
        altitude+=altitudeStep
    ){

        const r =
            radius *
            (
                1 -
                altitude/90
            );


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            r,
            0,
            Math.PI*2
        );

        ctx.stroke();


        if(
            altitude % 15 === 0
        ){

            ctx.fillText(
                `Alt ${altitude}°`,
                7,
                -r+13
            );

        }

    }


    /* =================================================
       AZIMUTH LINES
       ================================================= */

    for(
        let azimuth=0;
        azimuth<360;
        azimuth+=30
    ){

        const angle =
            (
                azimuth -
                90
            ) *
            Math.PI /
            180;


        const x =
            Math.cos(angle) *
            radius;


        const y =
            Math.sin(angle) *
            radius;


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.stroke();


        ctx.save();


        ctx.translate(
            x*.88,
            y*.88
        );


        ctx.rotate(
            angle +
            Math.PI/2
        );


        ctx.textAlign =
            "center";


        ctx.fillText(
            `Az ${azimuth}°`,
            0,
            0
        );


        ctx.restore();

    }


    /* =================================================
       HORIZON CIRCLE
       ================================================= */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI*2
    );


    ctx.lineWidth = 2;

    ctx.strokeStyle =
        "rgba(0,255,255,.8)";

    ctx.stroke();


    /* =================================================
       CLOUDS
       ================================================= */

    for(
        let i=0;
        i<cloudField.length;
        i++
    ){

        const cloud =
            cloudField[i];


        let cover;


        if(
            cloud.layer === "low"
        ){

            cover =
                lowCloud;

        }

        else if(
            cloud.layer === "mid"
        ){

            cover =
                midCloud;

        }

        else{

            cover =
                highCloud;

        }


        const randomThreshold =
            (i*37)%100;


        if(
            cover <=
            randomThreshold
        )
            continue;


        const cloudRadius =
            radius *
            (
                1 -
                cloud.altitude/90
            );


        const x =
            Math.cos(
                cloud.azimuth
            ) *
            cloudRadius;


        const y =
            Math.sin(
                cloud.azimuth
            ) *
            cloudRadius;


        let size;


        if(
            cloud.layer === "low"
        ){

            size =
                38 *
                cloud.scale;

        }

        else if(
            cloud.layer === "mid"
        ){

            size =
                29 *
                cloud.scale;

        }

        else{

            size =
                21 *
                cloud.scale;

        }


        size *=
            .7 +
            totalCloud/100;


        const cloudGradient =
            ctx.createRadialGradient(
                x,
                y,
                2,
                x,
                y,
                size
            );


        cloudGradient.addColorStop(
            0,
            `rgba(240,245,255,${Math.min(.8,cover/100+.15)})`
        );


        cloudGradient.addColorStop(
            .45,
            `rgba(190,205,225,${Math.min(.5,cover/200)})`
        );


        cloudGradient.addColorStop(
            1,
            "rgba(150,170,195,0)"
        );


        ctx.fillStyle =
            cloudGradient;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* =================================================
       NORTH / SOUTH / EAST / WEST
       ================================================= */

    ctx.fillStyle =
        "#00ffff";

    ctx.font =
        "bold 16px monospace";

    ctx.textAlign =
        "center";


    ctx.fillText(
        "N",
        0,
        -radius+25
    );


    ctx.fillText
