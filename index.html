<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellarium Real-Time Cloud Sky Map</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #030407;
            color: #e0e6ed;
            touch-action: none; 
        }
        canvas {
            display: block;
            cursor: grab;
            width: 100vw;
            height: 100vh;
        }
        canvas:active {
            cursor: grabbing;
        }
        
        /* Top Bar */
        #top-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(5, 8, 15, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 8px 20px;
            border-radius: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            z-index: 20;
            white-space: nowrap;
        }
        #app-logo {
            height: 32px;
            width: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
        }
        #tagline {
            font-size: 0.9em;
            font-weight: 700;
            color: #00ffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }

        #ui-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 8, 15, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #d1dce5;
            padding: 16px;
            border-radius: 12px;
            width: 95%;
            max-width: 680px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            z-index: 10;
            transition: padding 0.3s ease;
        }
        
        /* Panel Toggle Button */
        #toggle-panel {
            text-align: center;
            cursor: pointer;
            color: #00ffff;
            margin-top: -10px;
            margin-bottom: 12px;
            font-size: 1.1em;
            padding: 4px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        #toggle-panel:hover {
            opacity: 1;
        }
        
        /* Minimized State */
        #ui-panel.minimized #panel-content {
            display: none;
        }
        #ui-panel.minimized {
            padding-bottom: 10px;
        }
        #ui-panel.minimized #toggle-panel {
            margin-bottom: 0;
        }

        .time-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding-bottom: 6px;
        }
        #time-display {
            font-size: 1.15em;
            font-weight: 600;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
            font-family: monospace;
        }
        #coords-display {
            font-size: 0.85em;
            color: #8fa3b8;
            font-family: monospace;
        }
        .slider-container {
            margin: 12px 0 6px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: #00ffff;
            cursor: pointer;
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #64748b;
        }
        #weather-info {
            font-size: 0.85em;
            margin-top: 6px;
            color: #94a3b8;
        }

        .advanced-controls {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed rgba(0, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        input[type="number"], input[type="datetime-local"] {
            background: rgba(3, 4, 7, 0.8);
            color: #00ffff;
            border: 1px solid #00ffff;
            border-radius: 4px;
            padding: 6px;
            font-family: monospace;
            font-size: 0.85em;
        }
        button {
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        button:active {
            background: #00ffff;
            color: #000;
        }

        #loading {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 8, 15, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            display: none;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <img src="file_00000000325481faa9e72f433fdc296b.png" alt="App Logo" id="app-logo" onerror="this.style.display='none'">
        <span id="tagline">What clouds hide we show</span>
    </div>

    <div id="loading">Syncing Data...</div>
    <canvas id="skyCanvas"></canvas>

    <div id="ui-panel">
        <!-- Minimize/Expand Toggle -->
        <div id="toggle-panel" title="Toggle Panel">
            <span id="toggle-icon">▼</span>
        </div>
        
        <!-- Collapsible Content -->
        <div id="panel-content">
            <div class="time-header">
                <span id="time-display">Loading time...</span>
                <span id="coords-display">Lat: 20.26° N | Lon: 75.77° E</span>
            </div>
            
            <div class="slider-container">
                <span style="font-size: 0.8em; color: #8fa3b8;">-24h</span>
                <input type="range" id="timeSlider" min="-24" max="72" value="0" step="0.01">
                <span style="font-size: 0.8em; color: #8fa3b8;">+72h</span>
            </div>
            <div class="slider-labels">
                <span>Past 24 Hours</span>
                <span>Live</span>
                <span>Next 72 Hours</span>
            </div>

            <div id="weather-info">Cloud Cover: --</div>

            <div class="advanced-controls">
                <div class="control-row">
                    <span style="font-size: 0.8em; color: #8fa3b8; width: 60px;">Time:</span>
                    <input type="datetime-local" id="manualTime" style="flex-grow: 1;">
                </div>
                
                <div class="control-row">
                    <span style="font-size: 0.8em; color: #8fa3b8; width: 60px;">Location:</span>
                    <input type="number" id="latInput" placeholder="Lat" step="0.01" style="width: 75px;" value="20.26">
                    <input type="number" id="lonInput" placeholder="Lon" step="0.01" style="width: 75px;" value="75.77">
                    <button id="btnSetLoc">Set</button>
                    <button id="btnAutoLoc" style="flex-grow: 1;">📍 Auto GPS</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('skyCanvas');
    const ctx = canvas.getContext('2d');
    const timeSlider = document.getElementById('timeSlider');
    const timeDisplay = document.getElementById('time-display'); 
    const coordsDisplay = document.getElementById('coords-display');
    const weatherInfo = document.getElementById('weather-info');
    const loading = document.getElementById('loading');
    
    const manualTimeInput = document.getElementById('manualTime');
    const latInput = document.getElementById('latInput');
    const lonInput = document.getElementById('lonInput');
    const btnSetLoc = document.getElementById('btnSetLoc');
    const btnAutoLoc = document.getElementById('btnAutoLoc');
    
    // Panel toggle logic
    const uiPanel = document.getElementById('ui-panel');
    const togglePanel = document.getElementById('toggle-panel');
    const toggleIcon = document.getElementById('toggle-icon');

    togglePanel.addEventListener('click', () => {
        uiPanel.classList.toggle('minimized');
        if (uiPanel.classList.contains('minimized')) {
            toggleIcon.innerText = '▲';
        } else {
            toggleIcon.innerText = '▼';
        }
    });

    let lat = 20.26;
    let lon = 75.77;

    let scale = 1;
    let panX = window.innerWidth / 2;
    let panY = window.innerHeight / 2;
    let isDragging = false;
    let startDragX, startDragY;

    let weatherData = null;
    let isUpdatingTimeInput = false;

    function createDefaultWeatherData() {
        const now = new Date();
        const times = [];
        for (let i = -24; i <= 72; i++) {
            const d = new Date(now.getTime() + i * 3600000);
            times.push(d.toISOString());
        }
        return {
            time: times,
            cloud_cover: Array(97).fill(30),
            cloud_cover_low: Array(97).fill(10),
            cloud_cover_mid: Array(97).fill(10),
            cloud_cover_high: Array(97).fill(10),
            is_day: Array(97).fill(1),
            wind_direction_10m: Array(97).fill(0),
            currentIndex: 24,
            isError: false
        };
    }

    function lerp(start, end, t) {
        return start * (1 - t) + end * t;
    }
    function lerpColor(c1, c2, t) {
        return [
            Math.round(c1[0] + (c2[0] - c1[0]) * t),
            Math.round(c1[1] + (c2[1] - c1[1]) * t),
            Math.round(c1[2] + (c2[2] - c1[2]) * t)
        ];
    }

    const cloudTextures = {};
    function createCloudTexture(type) {
        const pCanvas = document.createElement('canvas');
        const pCtx = pCanvas.getContext('2d');
        const size = type === 'low' ? 256 : (type === 'mid' ? 192 : 128);
        pCanvas.width = size;
        pCanvas.height = size;

        const grad = pCtx.createRadialGradient(size/2, size/2, 5, size/2, size/2, size/2);
        if (type === 'low') {
            grad.addColorStop(0, 'rgba(240, 243, 248, 0.85)');
            grad.addColorStop(0.4, 'rgba(200, 210, 225, 0.6)');
            grad.addColorStop(0.8, 'rgba(150, 165, 185, 0.2)');
            grad.addColorStop(1, 'rgba(150, 165, 185, 0)');
        } else if (type === 'mid') {
            grad.addColorStop(0, 'rgba(230, 235, 245, 0.7)');
            grad.addColorStop(0.5, 'rgba(180, 195, 215, 0.4)');
            grad.addColorStop(1, 'rgba(180, 195, 215, 0)');
        } else { 
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
            grad.addColorStop(0.6, 'rgba(220, 230, 245, 0.2)');
            grad.addColorStop(1, 'rgba(220, 230, 245, 0)');
        }

        pCtx.fillStyle = grad;
        pCtx.beginPath();
        pCtx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
        pCtx.fill();
        return pCanvas;
    }

    cloudTextures.low = createCloudTexture('low');
    cloudTextures.mid = createCloudTexture('mid');
    cloudTextures.high = createCloudTexture('high');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        if (scale === 1 && panX === 0 && panY === 0) {
            panX = canvas.width / 2;
            panY = canvas.height / 2;
        }
        draw();
    }
    window.addEventListener('resize', resize);

    async function fetchWeatherData() {
        loading.innerText = "Fetching live Open-Meteo data...";
        loading.style.display = 'block';

        try {
            // All displayed weather values come directly from Open-Meteo.
            // No synthetic weather values are used as a fallback.
            const params = new URLSearchParams({
                latitude: lat,
                longitude: lon,
                hourly: [
                    'temperature_2m',
                    'relative_humidity_2m',
                    'pressure_msl',
                    'precipitation',
                    'precipitation_probability',
                    'weather_code',
                    'cloud_cover',
                    'cloud_cover_low',
                    'cloud_cover_mid',
                    'cloud_cover_high',
                    'wind_speed_10m',
                    'wind_direction_10m',
                    'is_day'
                ].join(','),
                past_days: 1,
                forecast_days: 4,
                timezone: 'auto'
            });

            const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`, {
                headers: { 'Accept': 'application/json' }
            });

            if (!response.ok) {
                throw new Error(`Open-Meteo HTTP ${response.status}`);
            }

            const data = await response.json();
            if (data.error) throw new Error(data.reason || 'Open-Meteo returned an error.');
            if (!data.hourly || !data.hourly.time || data.hourly.time.length === 0) {
                throw new Error('Open-Meteo returned no hourly weather data.');
            }

            weatherData = data.hourly;
            weatherData.currentIndex = Math.min(24, weatherData.time.length - 2);
            weatherData.timezone = data.timezone || 'local';
            weatherData.timezone_abbreviation = data.timezone_abbreviation || '';
            weatherData.isError = false;

            let latDir = lat >= 0 ? 'N' : 'S';
            let lonDir = lon >= 0 ? 'E' : 'W';
            coordsDisplay.innerText = `Lat: ${Math.abs(lat).toFixed(2)}° ${latDir} | Lon: ${Math.abs(lon).toFixed(2)}° ${lonDir} | Open-Meteo: ${weatherData.timezone_abbreviation || weatherData.timezone}`;

            draw();
        } catch (e) {
            console.error('Open-Meteo fetch failed:', e);
            weatherData = null;
            timeDisplay.innerText = 'Open-Meteo data unavailable';
            weatherInfo.innerText = `LIVE DATA ERROR: ${e.message}`;
            loading.innerText = 'Open-Meteo connection failed';
            drawStaticSky();
        } finally {
            setTimeout(() => { loading.style.display = 'none'; }, 900);
        }
    }

    // Draw the dome/grid even if the network request fails, but NEVER invent
    // weather values. This keeps the visualization honest.
    function drawStaticSky() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const skyRadius = Math.min(canvas.width, canvas.height) * 0.42 * scale;
        ctx.save();
        ctx.translate(panX, panY);
        ctx.fillStyle = '#03040a';
        ctx.fillRect(-panX, -panY, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(0, 0, skyRadius, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, skyRadius);
        grad.addColorStop(0, '#14283a');
        grad.addColorStop(1, '#06101b');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(0,255,255,0.25)';
        ctx.lineWidth = 1;
        for (let alt = 0; alt < 90; alt += 15) {
            const r = skyRadius * (1 - alt / 90);
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.stroke();
        }
        for (let az = 0; az < 360; az += 30) {
            const a = (az - 90) * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * skyRadius, Math.sin(a) * skyRadius);
            ctx.stroke();
        }
        ctx.restore();

        const compass = [['N',0],['NE',45],['E',90],['SE',135],['S',180],['SW',225],['W',270],['NW',315]];
        ctx.font = 'bold 17px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        compass.forEach(([label, az]) => {
            const a = (az - 90) * Math.PI / 180;
            const r = skyRadius * 1.08;
            ctx.fillStyle = label === 'N' ? '#ff1744' : '#00ffff';
            ctx.fillText(label, Math.cos(a) * r, Math.sin(a) * r);
        });
        ctx.restore();
    }

    function formatDMS(degrees) {
        let isNeg = degrees < 0;
        let absDeg = Math.abs(degrees);
        let d = Math.floor(absDeg);
        let minFloat = (absDeg - d) * 60;
        let m = Math.floor(minFloat);
        let secFloat = (minFloat - m) * 60;
        let s = Math.floor(secFloat);
        
        let micro = Math.floor((secFloat - s) * 1000000);
        let microStr = micro.toString().padStart(6, '0');

        if (scale > 1000) {
            return `${isNeg ? '-' : ''}${d}°${m}'${s}.${microStr}"`;
        } else {
            return `${isNeg ? '-' : ''}${d}°${m}'${s}"`;
        }
    }

    let cloudField = [];
    function generateProceduralCloudPositions() {
        cloudField = [];
        for (let i = 0; i < 400; i++) {
            cloudField.push({
                azimuth: Math.random() * Math.PI * 2,
                altitude: Math.pow(Math.random(), 0.7) * 88,
                scaleMod: 0.7 + Math.random() * 0.8,
                layer: Math.random() < 0.4 ? 'low' : (Math.random() < 0.7 ? 'mid' : 'high')
            });
        }
    }

    function draw() {
        if (!weatherData) return;

        const exactOffset = parseFloat(timeSlider.value);
        let idx0 = weatherData.currentIndex + Math.floor(exactOffset);
        let idx1 = idx0 + 1;
        let t = exactOffset - Math.floor(exactOffset);

        if (idx0 < 0) idx0 = 0;
        if (idx1 >= weatherData.time.length) idx1 = weatherData.time.length - 1;

        // Open-Meteo returns local ISO timestamps when timezone=auto.
        // Parse them as displayed by the user's browser locale.
        let time0 = new Date(weatherData.time[idx0]).getTime();
        let time1 = new Date(weatherData.time[idx1]).getTime();
        let exactTime = new Date(lerp(time0, time1, t));
        
        timeDisplay.innerText = exactTime.toLocaleString([], {
            weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        
        if (!isUpdatingTimeInput) {
            let tzOffset = exactTime.getTimezoneOffset() * 60000;
            let localISOTime = (new Date(exactTime.getTime() - tzOffset)).toISOString().slice(0, 16);
            manualTimeInput.value = localISOTime;
        }

        let cTotal = lerp(weatherData.cloud_cover[idx0], weatherData.cloud_cover[idx1], t);
        let cLow = lerp(weatherData.cloud_cover_low[idx0], weatherData.cloud_cover_low[idx1], t);
        let cMid = lerp(weatherData.cloud_cover_mid[idx0], weatherData.cloud_cover_mid[idx1], t);
        let cHigh = lerp(weatherData.cloud_cover_high[idx0], weatherData.cloud_cover_high[idx1], t);
        
        const temp = lerp(weatherData.temperature_2m[idx0], weatherData.temperature_2m[idx1], t);
        const humidity = lerp(weatherData.relative_humidity_2m[idx0], weatherData.relative_humidity_2m[idx1], t);
        const pressure = lerp(weatherData.pressure_msl[idx0], weatherData.pressure_msl[idx1], t);
        const precip = lerp(weatherData.precipitation[idx0], weatherData.precipitation[idx1], t);
        const precipProb = lerp(weatherData.precipitation_probability[idx0], weatherData.precipitation_probability[idx1], t);
        const windSpeed = lerp(weatherData.wind_speed_10m[idx0], weatherData.wind_speed_10m[idx1], t);

        weatherInfo.innerText = `Open-Meteo • ${Math.round(temp)}°C | RH ${Math.round(humidity)}% | Pressure ${Math.round(pressure)} hPa | Rain ${precip.toFixed(1)} mm (${Math.round(precipProb)}%) | Wind ${windSpeed.toFixed(1)} km/h | Clouds ${Math.round(cTotal)}% (L ${Math.round(cLow)} / M ${Math.round(cMid)} / H ${Math.round(cHigh)})`;

        let w0 = weatherData.wind_direction_10m[idx0] || 0;
        let w1 = weatherData.wind_direction_10m[idx1] || 0;
        let wDiff = (w1 - w0 + 540) % 360 - 180; 
        let windDir = (w0 + wDiff * t) * Math.PI / 180;
        let dayRatio = lerp(weatherData.is_day[idx0], weatherData.is_day[idx1], t);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const skyRadius = Math.min(canvas.width, canvas.height) * 0.42 * scale;

        ctx.save();
        ctx.translate(panX, panY);

        ctx.fillStyle = "#03040a"; 
        ctx.fillRect(-panX, -panY, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(0, 0, skyRadius, 0, Math.PI * 2);

        let sCol1 = lerpColor([2, 5, 12], [20, 60, 90], dayRatio);
        let sCol2 = lerpColor([4, 9, 22], [15, 45, 75], dayRatio);
        let sCol3 = lerpColor([8, 15, 30], [25, 70, 110], dayRatio);

        let skyGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, skyRadius);
        skyGrad.addColorStop(0, `rgb(${sCol1[0]},${sCol1[1]},${sCol1[2]})`);
        skyGrad.addColorStop(0.7, `rgb(${sCol2[0]},${sCol2[1]},${sCol2[2]})`);
        skyGrad.addColorStop(1, `rgb(${sCol3[0]},${sCol3[1]},${sCol3[2]})`);
        
        ctx.fillStyle = skyGrad;
        ctx.fill();

        ctx.save();
        ctx.clip();

        ctx.lineWidth = 1;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 5;
        
        let gridR = 0, gridG = 255, gridB = 255;
        let alpha = lerp(0.15, 0.4, dayRatio);
        
        ctx.strokeStyle = `rgba(${gridR}, ${gridG}, ${gridB}, ${alpha})`;
        ctx.fillStyle = `rgba(${gridR}, ${gridG}, ${gridB}, ${alpha + 0.3})`;
        ctx.font = "11px monospace";

        let altStep = 15;
        if (scale > 4) altStep = 5;
        if (scale > 15) altStep = 1;
        if (scale > 100) altStep = 1/60; 

        for (let alt = 0; alt < 90; alt += altStep) {
            let r = skyRadius * (1 - alt / 90);
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.stroke();

            if (scale > 1.5 || alt % 15 === 0) {
                ctx.fillText(`Alt ${formatDMS(alt)}`, 6, -r + 12);
            }
        }

        let azStep = altStep >= 1 ? 30 : 15;
        for (let az = 0; az < 360; az += azStep) {
            let angle = (az - 90) * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            let edgeX = Math.cos(angle) * skyRadius;
            let edgeY = Math.sin(angle) * skyRadius;
            ctx.lineTo(edgeX, edgeY);
            ctx.stroke();

            if (scale > 1.5 || az % 30 === 0) {
                ctx.save();
                ctx.translate(edgeX * 0.9, edgeY * 0.9); 
                ctx.rotate(angle + Math.PI/2);
                ctx.textAlign = "center";
                ctx.fillText(`Az ${formatDMS(az)}`, 0, 0);
                ctx.restore();
            }
        }

        ctx.shadowBlur = 0;

        let globalCloudAlpha = lerp(0.45, 0.85, dayRatio);
        cloudField.forEach((c, idx) => {
            let targetCover = c.layer === 'low' ? cLow : (c.layer === 'mid' ? cMid : cHigh);
            let threshold = idx % 100;
            let visibilityDiff = targetCover - threshold;
            
            if (visibilityDiff > 0) {
                let localAlpha = visibilityDiff < 1 ? visibilityDiff : 1.0; 
                // Azimuth convention:
                // 0° = North (top), 90° = East (right),
                // 180° = South (bottom), 270° = West (left).
                let az = c.azimuth + windDir * 0.1;
                let r = skyRadius * (1 - c.altitude / 90);
                let skyAngle = az - Math.PI / 2;

                let x = Math.cos(skyAngle) * r;
                let y = Math.sin(skyAngle) * r;

                let img = cloudTextures[c.layer];
                let renderSize = 80 * c.scaleMod;
let renderW = renderSize;
let renderH = renderSize;

ctx.save();
ctx.globalAlpha = globalCloudAlpha * localAlpha;
ctx.drawImage(
    img,
    x - renderW / 2,
    y - renderH / 2,
    renderW,
    renderH
);
ctx.restore();
            }
        });
        ctx.restore(); // end clipped sky/grid layer

        // Compass directions are fixed to the azimuth coordinate system.
        const compass = [
            { label: "N", az: 0 },
            { label: "NE", az: 45 },
            { label: "E", az: 90 },
            { label: "SE", az: 135 },
            { label: "S", az: 180 },
            { label: "SW", az: 225 },
            { label: "W", az: 270 },
            { label: "NW", az: 315 }
        ];

        ctx.shadowColor = "#00ffff";
        ctx.shadowBlur = 10;
        ctx.font = "bold 17px Segoe UI, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        compass.forEach(c => {
            const angle = (c.az - 90) * Math.PI / 180;
            const r = skyRadius * 1.08;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;

            ctx.fillStyle = c.label === "N" ? "#ff1744" : "#00ffff";
            ctx.fillText(c.label, x, y);
        });

        ctx.shadowBlur = 0;

        // Center marker = observer / zenith.
        ctx.beginPath();
        ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = "#ff1744";
        ctx.shadowColor = "#ff1744";
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Small legend.
        const legendY = -skyRadius - 28;
        ctx.font = "11px monospace";
        ctx.textAlign = "left";
        ctx.fillStyle = "rgba(0,255,255,0.75)";
        ctx.fillText("AZ 0° = North   •   ALT 90° = Zenith", -skyRadius, legendY);

        ctx.restore(); // end sky transform
    }

    // ---------- Interaction ----------
    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function screenToSky(clientX, clientY) {
        return {
            x: (clientX - panX) / scale,
            y: (clientY - panY) / scale
        };
    }

    function getCloudAtPoint(clientX, clientY) {
        if (!weatherData) return null;

        const p = screenToSky(clientX, clientY);
        const skyRadius = Math.min(canvas.width, canvas.height) * 0.42 * scale;

        // Convert screen point back into the unscaled sky coordinate system.
        const ux = p.x * scale;
        const uy = p.y * scale;
        const r = Math.hypot(ux, uy);

        if (r > skyRadius) return null;

        const angle = Math.atan2(uy, ux);
        const azimuth = (angle * 180 / Math.PI + 90 + 360) % 360;
        const altitude = 90 * (1 - r / skyRadius);

        return { azimuth, altitude };
    }

    canvas.addEventListener("wheel", (e) => {
        e.preventDefault();

        const oldScale = scale;
        const zoomFactor = Math.exp(-e.deltaY * 0.0015);
        const newScale = clamp(oldScale * zoomFactor, 0.65, 80);

        // Zoom around the cursor.
        const mx = e.clientX;
        const my = e.clientY;
        panX = mx - (mx - panX) * (newScale / oldScale);
        panY = my - (my - panY) * (newScale / oldScale);

        scale = newScale;
        draw();
    }, { passive: false });

    canvas.addEventListener("pointerdown", (e) => {
        isDragging = true;
        startDragX = e.clientX - panX;
        startDragY = e.clientY - panY;
        canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        panX = e.clientX - startDragX;
        panY = e.clientY - startDragY;
        draw();
    });

    canvas.addEventListener("pointerup", (e) => {
        isDragging = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    });

    canvas.addEventListener("pointercancel", () => {
        isDragging = false;
    });

    // Double-click/tap resets the view.
    canvas.addEventListener("dblclick", () => {
        scale = 1;
        panX = canvas.width / 2;
        panY = canvas.height / 2;
        draw();
    });

    // ---------- Time controls ----------
    timeSlider.addEventListener("input", draw);

    manualTimeInput.addEventListener("change", () => {
        if (!weatherData || !weatherData.time || !weatherData.time.length) return;

        const chosen = new Date(manualTimeInput.value);
        if (Number.isNaN(chosen.getTime())) return;

        const base = new Date(weatherData.time[weatherData.currentIndex]).getTime();
        let offsetHours = (chosen.getTime() - base) / 3600000;

        offsetHours = clamp(
            offsetHours,
            Number(timeSlider.min),
            Number(timeSlider.max)
        );

        isUpdatingTimeInput = true;
        timeSlider.value = offsetHours.toFixed(2);
        isUpdatingTimeInput = false;
        draw();
    });

    // ---------- Location ----------
    btnSetLoc.addEventListener("click", () => {
        const newLat = Number(latInput.value);
        const newLon = Number(lonInput.value);

        if (
            !Number.isFinite(newLat) ||
            !Number.isFinite(newLon) ||
            newLat < -90 || newLat > 90 ||
            newLon < -180 || newLon > 180
        ) {
            alert("Please enter a valid latitude (-90 to 90) and longitude (-180 to 180).");
            return;
        }

        lat = newLat;
        lon = newLon;
        fetchWeatherData();
    });

    btnAutoLoc.addEventListener("click", () => {
        if (!navigator.geolocation) {
            alert("Geolocation is not supported by this browser.");
            return;
        }

        loading.innerText = "Getting GPS location...";
        loading.style.display = "block";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                lat = position.coords.latitude;
                lon = position.coords.longitude;

                latInput.value = lat.toFixed(4);
                lonInput.value = lon.toFixed(4);

                fetchWeatherData();
            },
            (error) => {
                loading.style.display = "none";
                alert("Could not get your location: " + error.message);
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 300000
            }
        );
    });

    // ---------- Cloud generation ----------
    // Open-Meteo gives cloud-cover percentages, not individual cloud coordinates.
    // These procedural clouds therefore represent the requested cloud percentage
    // in the AZ/ALT sky dome. Replace this generator later with real cloud-vector
    // data if you have an API that supplies cloud positions.
    function seededRandom(seed) {
        let x = Math.sin(seed * 12.9898) * 43758.5453;
        return x - Math.floor(x);
    }

    function generateProceduralCloudPositions() {
        cloudField = [];

        for (let i = 0; i < 400; i++) {
            const r1 = seededRandom(i + 11);
            const r2 = seededRandom(i + 97);
            const r3 = seededRandom(i + 251);
            const r4 = seededRandom(i + 503);

            let layer;
            if (r1 < 0.40) layer = "low";
            else if (r1 < 0.72) layer = "mid";
            else layer = "high";

            // Avoid putting most clouds exactly at the zenith.
            const altitude = 3 + Math.pow(r2, 0.72) * 84;

            cloudField.push({
                azimuth: r3 * Math.PI * 2,
                altitude,
                scaleMod: 0.65 + r4 * 0.9,
                layer,
                drift: 0.15 + seededRandom(i + 801) * 0.55
            });
        }
    }

    // Re-seed once at startup.
    generateProceduralCloudPositions();

    // ---------- Startup ----------
    function initialize() {
        resize();

        // Use a sensible local datetime for the datetime-local control.
        const now = new Date();
        const tzOffset = now.getTimezoneOffset() * 60000;
        manualTimeInput.value = new Date(now.getTime() - tzOffset)
            .toISOString()
            .slice(0, 16);

        fetchWeatherData();
    }

    // Refresh the forecast periodically so the map remains useful as a live view.
    setInterval(() => {
        fetchWeatherData();
    }, 15 * 60 * 1000);

    initialize();
</script>
</body>
</html>
