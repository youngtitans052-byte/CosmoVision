<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellarium Real-Time Cloud Sky Map</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents whole-page scrolling */
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #050811;
            color: #e0e6ed;
            touch-action: none; /* Allows canvas to handle all touch events */
        }
        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        
        /* Stellarium-inspired UI Overlay */
        #ui-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 16, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d1dce5;
            padding: 16px 28px;
            border-radius: 12px;
            width: 90%;
            max-width: 680px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .time-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }
        #time-display {
            font-size: 1.15em;
            font-weight: 600;
            color: #ffb400;
            font-family: monospace;
        }
        #coords-display {
            font-size: 0.85em;
            color: #8fa3b8;
            font-family: monospace;
        }
        .slider-container {
            margin: 12px 0 6px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: #ffb400;
            cursor: pointer;
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #64748b;
        }
        #weather-info {
            font-size: 0.85em;
            margin-top: 6px;
            color: #94a3b8;
        }
        #loading {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 16, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffb400;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading">Syncing Open-Meteo Cloud Data...</div>
    <canvas id="skyCanvas"></canvas>

    <div id="ui-panel">
        <div class="time-header">
            <span id="time-display">Loading time...</span>
            <span id="coords-display">Lat: 20.26° N | Lon: 75.77° E</span>
        </div>
        
        <div class="slider-container">
            <span style="font-size: 0.8em; color: #8fa3b8;">-24h</span>
            <input type="range" id="timeSlider" min="-24" max="72" value="0" step="1">
            <span style="font-size: 0.8em; color: #8fa3b8;">+72h</span>
        </div>
        <div class="slider-labels">
            <span>Past 24 Hours</span>
            <span>Live</span>
            <span>Next 72 Hours</span>
        </div>

        <div id="weather-info">Cloud Cover: --</div>
    </div>

<script>
    const canvas = document.getElementById('skyCanvas');
    const ctx = canvas.getContext('2d');
    const timeSlider = document.getElementById('timeSlider');
    const timeDisplay = document.getElementById('timeDisplay');
    const weatherInfo = document.getElementById('weather-info');
    const loading = document.getElementById('loading');

    // Default Coordinates
    let lat = 20.26;
    let lon = 75.77;

    // View Transformation Parameters
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startDragX, startDragY;

    // Data State
    let weatherData = null;
    let baseTime = new Date();
    baseTime.setMinutes(0, 0, 0);

    // Offscreen Cloud Puff Textures Generator
    const cloudTextures = {};
    function createCloudTexture(type) {
        const pCanvas = document.createElement('canvas');
        const pCtx = pCanvas.getContext('2d');
        const size = type === 'low' ? 256 : (type === 'mid' ? 192 : 128);
        pCanvas.width = size;
        pCanvas.height = size;

        const grad = pCtx.createRadialGradient(size/2, size/2, 5, size/2, size/2, size/2);
        if (type === 'low') {
            grad.addColorStop(0, 'rgba(240, 243, 248, 0.85)');
            grad.addColorStop(0.4, 'rgba(200, 210, 225, 0.6)');
            grad.addColorStop(0.8, 'rgba(150, 165, 185, 0.2)');
            grad.addColorStop(1, 'rgba(150, 165, 185, 0)');
        } else if (type === 'mid') {
            grad.addColorStop(0, 'rgba(230, 235, 245, 0.7)');
            grad.addColorStop(0.5, 'rgba(180, 195, 215, 0.4)');
            grad.addColorStop(1, 'rgba(180, 195, 215, 0)');
        } else { // High wispy cloud
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
            grad.addColorStop(0.6, 'rgba(220, 230, 245, 0.2)');
            grad.addColorStop(1, 'rgba(220, 230, 245, 0)');
        }

        pCtx.fillStyle = grad;
        pCtx.beginPath();
        pCtx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
        pCtx.fill();
        return pCanvas;
    }

    cloudTextures.low = createCloudTexture('low');
    cloudTextures.mid = createCloudTexture('mid');
    cloudTextures.high = createCloudTexture('high');

    // Canvas Resize
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        if (scale === 1 && panX === 0 && panY === 0) {
            panX = canvas.width / 2;
            panY = canvas.height / 2;
        }
        draw();
    }
    window.addEventListener('resize', resize);

    // Fetch Open-Meteo Data
    async function fetchWeatherData() {
        loading.style.display = 'block';
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,is_day,wind_direction_10m&past_days=1&forecast_days=4`;
            const response = await fetch(url);
            const data = await response.json();
            weatherData = data.hourly;
            
            const nowIso = baseTime.toISOString().slice(0, 14) + "00";
            let currentIndex = weatherData.time.findIndex(t => t.startsWith(nowIso));
            if (currentIndex === -1) currentIndex = 24;

            weatherData.currentIndex = currentIndex;
            updateUI();
            generateProceduralCloudPositions();
            draw();
        } catch (e) {
            console.error("Open-Meteo fetch failed:", e);
            document.getElementById('time-display').innerText = "Data Fetch Error";
        }
        loading.style.display = 'none';
    }

    // Format Degree into DD° MM' SS.µs"
    function formatDMS(degrees) {
        let isNeg = degrees < 0;
        let absDeg = Math.abs(degrees);
        let d = Math.floor(absDeg);
        let minFloat = (absDeg - d) * 60;
        let m = Math.floor(minFloat);
        let secFloat = (minFloat - m) * 60;
        let s = Math.floor(secFloat);
        
        let micro = Math.floor((secFloat - s) * 1000000);
        let microStr = micro.toString().padStart(6, '0');

        if (scale > 1000) {
            return `${isNeg ? '-' : ''}${d}°${m}'${s}.${microStr}"`;
        } else {
            return `${isNeg ? '-' : ''}${d}°${m}'${s}"`;
        }
    }

    // Static cloud position seed array across sky dome
    let cloudField = [];
    function generateProceduralCloudPositions() {
        cloudField = [];
        for (let i = 0; i < 400; i++) {
            cloudField.push({
                azimuth: Math.random() * Math.PI * 2,
                altitude: Math.pow(Math.random(), 0.7) * 88,
                scaleMod: 0.7 + Math.random() * 0.8,
                layer: Math.random() < 0.4 ? 'low' : (Math.random() < 0.7 ? 'mid' : 'high')
            });
        }
    }

    function updateUI() {
        if (!weatherData) return;
        const targetIndex = weatherData.currentIndex + parseInt(timeSlider.value);
        
        if (targetIndex >= 0 && targetIndex < weatherData.time.length) {
            const t = new Date(weatherData.time[targetIndex]);
            document.getElementById('time-display').innerText = t.toLocaleString([], {
                weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            
            const total = weatherData.cloud_cover[targetIndex];
            weatherInfo.innerText = `Total Cloudiness: ${total}% | Low: ${weatherData.cloud_cover_low[targetIndex]}% | Mid: ${weatherData.cloud_cover_mid[targetIndex]}% | High: ${weatherData.cloud_cover_high[targetIndex]}%`;
            
            draw();
        }
    }

    // Render Function
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!weatherData) return;

        const targetIndex = weatherData.currentIndex + parseInt(timeSlider.value);
        if (targetIndex < 0 || targetIndex >= weatherData.time.length) return;

        const isDay = weatherData.is_day[targetIndex];
        const skyRadius = Math.min(canvas.width, canvas.height) * 0.42 * scale;

        ctx.save();
        ctx.translate(panX, panY);

        // 1. Draw Green Ground Floor
        ctx.fillStyle = "#163a19";
        ctx.fillRect(-panX, -panY, canvas.width, canvas.height);

        // 2. Draw Atmosphere / Sky Dome Disc
        ctx.beginPath();
        ctx.arc(0, 0, skyRadius, 0, Math.PI * 2);

        let skyGrad;
        if (isDay) {
            skyGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, skyRadius);
            skyGrad.addColorStop(0, '#62a2df');
            skyGrad.addColorStop(0.7, '#3b7ebf');
            skyGrad.addColorStop(1, '#81b3e6');
        } else {
            skyGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, skyRadius);
            skyGrad.addColorStop(0, '#040914');
            skyGrad.addColorStop(0.8, '#081224');
            skyGrad.addColorStop(1, '#0e1b30');
        }
        ctx.fillStyle = skyGrad;
        ctx.fill();

        // Clip drawing to inside the celestial sphere
        ctx.save();
        ctx.clip();

        // 3. Coordinate Grids
        ctx.lineWidth = 1;
        ctx.strokeStyle = isDay ? "rgba(255, 255, 255, 0.25)" : "rgba(80, 220, 120, 0.25)";
        ctx.fillStyle = isDay ? "rgba(255, 255, 255, 0.7)" : "rgba(80, 220, 120, 0.8)";
        ctx.font = "11px monospace";

        let altStep = 15;
        if (scale > 4) altStep = 5;
        if (scale > 15) altStep = 1;
        if (scale > 100) altStep = 1/60; 
        if (scale > 2000) altStep = 1/3600; 

        for (let alt = 0; alt < 90; alt += altStep) {
            let r = skyRadius * (1 - alt / 90);
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.stroke();

            if (scale > 1.5 || alt % 15 === 0) {
                ctx.fillText(`Alt ${formatDMS(alt)}`, 6, -r + 12);
            }
        }

        // Azimuth Radial Lines
        let azStep = altStep >= 1 ? 30 : 15;
        for (let az = 0; az < 360; az += azStep) {
            let angle = (az - 90) * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(angle) * skyRadius, Math.sin(angle) * skyRadius);
            ctx.stroke();
        }

        // 4. Render Clouds
        const cLow = weatherData.cloud_cover_low[targetIndex];
        const cMid = weatherData.cloud_cover_mid[targetIndex];
        const cHigh = weatherData.cloud_cover_high[targetIndex];
        const windDir = (weatherData.wind_direction_10m[targetIndex] || 0) * Math.PI / 180;

        cloudField.forEach((c, idx) => {
            let cover = c.layer === 'low' ? cLow : (c.layer === 'mid' ? cMid : cHigh);
            if ((idx % 100) < cover) {
                let shift = (targetIndex % 24) * 0.02;
                let az = c.azimuth + windDir * 0.1;
                let r = skyRadius * (1 - c.altitude / 90);

                let x = Math.cos(az) * r;
                let y = Math.sin(az) * r;

                let img = cloudTextures[c.layer];
                let renderSize = img.width * c.scaleMod * (scale * 0.5);

                ctx.save();
                ctx.globalAlpha = isDay ? 0.85 : 0.45;
                ctx.drawImage(img, x - renderSize/2, y - renderSize/2, renderSize, renderSize);
                ctx.restore();
            }
        });

        // Zenith Center Point
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#ff3333";
        ctx.fill();

        ctx.restore(); // Exit clip

        // 5. Horizon Edge Ring & Direction Labels
        ctx.beginPath();
        ctx.arc(0, 0, skyRadius, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#2d6a31"; 
        ctx.stroke();

        const directions = [
            { label: 'N', angle: -90, color: '#ff4d4d' },
            { label: 'NE', angle: -45, color: '#ffffff' },
            { label: 'E', angle: 0, color: '#ffffff' },
            { label: 'SE', angle: 45, color: '#ffffff' },
            { label: 'S', angle: 90, color: '#ffffff' },
            { label: 'SW', angle: 135, color: '#ffffff' },
            { label: 'W', angle: 180, color: '#ffffff' },
            { label: 'NW', angle: 225, color: '#ffffff' }
        ];

        ctx.font = "bold 15px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        directions.forEach(d => {
            let rad = d.angle * Math.PI / 180;
            let lx = Math.cos(rad) * (skyRadius + 18);
            let ly = Math.sin(rad) * (skyRadius + 18);

            ctx.fillStyle = "rgba(10, 16, 26, 0.7)";
            ctx.beginPath();
            ctx.arc(lx, ly, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = d.color;
            ctx.fillText(d.label, lx, ly + 1);
        });

        ctx.restore();
    }

    // --- INTERACTIVITY: ZOOM & PAN (DESKTOP + MOBILE TOUCH) ---

    // Apply Zoom logic shared by mouse and touch
    function applyZoom(zoomFactor, clientX, clientY) {
        const mouseX = clientX - panX;
        const mouseY = clientY - panY;

        scale *= zoomFactor;
        scale = Math.max(0.5, Math.min(scale, 100000)); // allow deep microsecond zoom

        panX -= mouseX * (zoomFactor - 1);
        panY -= mouseY * (zoomFactor - 1);
        draw();
    }

    // 1. Desktop Mouse Wheel Zoom
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
        applyZoom(zoomFactor, e.clientX, e.clientY);
    }, { passive: false });

    // 2. Desktop Mouse Drag Pan
    canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        startDragX = e.clientX - panX;
        startDragY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startDragX;
        panY = e.clientY - startDragY;
        draw();
    });

    window.addEventListener('mouseup', () => isDragging = false);

    // 3. Mobile Touch Pan & Pinch Zoom
    let initialPinchDistance = null;

    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) { // Single finger swipe (Pan)
            isDragging = true;
            startDragX = e.touches[0].clientX - panX;
            startDragY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) { // Two fingers (Pinch Zoom)
            isDragging = false;
            initialPinchDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        e.preventDefault(); // Prevent standard mobile page scroll/pull-to-refresh
        if (e.touches.length === 1 && isDragging) {
            panX = e.touches[0].clientX - startDragX;
            panY = e.touches[0].clientY - startDragY;
            draw();
        } else if (e.touches.length === 2 && initialPinchDistance) {
            const currentDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            
            const zoomFactor = currentDistance / initialPinchDistance;
            const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

            applyZoom(zoomFactor, centerX, centerY);
            initialPinchDistance = currentDistance; // reset for smooth continuous zoom
        }
    }, { passive: false });

    window.addEventListener('touchend', () => {
        isDragging = false;
        initialPinchDistance = null;
    });

    // Time Slider Event
    timeSlider.addEventListener('input', updateUI);

    // Initialization
    resize();
    fetchWeatherData();
</script>
</body>
</html>
